name: Health

# Runs every four hours and does two jobs with one request:
#
#   1. Uptime. Fails loudly if the live site stops serving data, and GitHub
#      emails on a failed scheduled run, so this is the alerting channel with no
#      third-party service and no account to manage.
#   2. Supabase keepalive. The free tier pauses a project after a stretch of
#      inactivity, and a request every four hours is far more than enough to
#      prevent it.
#
# One request covers both because the check is deliberately end to end. It busts
# the CDN cache, so it reaches the function, and the listing query is not cached
# in process — every /api/games request goes to the database. A response with
# game data in it therefore proves the database answered, which is a stronger
# signal than pinging Supabase directly would be: it exercises the same path a
# visitor does, and it cannot pass while any link in that chain is down.
#
# There was a separate PostgREST ping here until it was removed. It had failed
# on every scheduled run since 2025 because the SUPABASE_URL and
# SUPABASE_ANON_KEY secrets are not set on this repository, and fixing it would
# have bought a weaker check that duplicated this one. Nothing here needs a
# secret now, which is the reason it stays working.
#
# Caveat worth knowing: GitHub disables scheduled workflows on a public repo
# after 60 days with no repository activity. Ordinary commits reset that clock.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# Scheduled runs can be delayed under load. Don't let a backlog stack up.
concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Site serves live data end to end
        run: |
          # `_hc` busts the CDN cache deliberately. /api/games sets s-maxage, so
          # without it this could be answered by a stale edge copy and stay green
          # with the function or the database completely dead.
          #
          # Retries before failing so a transient blip doesn't send mail. The
          # real cost of checking often is inbox noise, not Actions minutes,
          # which are unmetered on public repositories.
          for attempt in 1 2 3; do
            RESPONSE=$(curl -sS --max-time 20 -w $'\n%{http_code}' \
              "https://launchoptions.dev/api/games?limit=1&_hc=$(date +%s)") || RESPONSE=""
            CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            if [ "$CODE" = "200" ] && printf '%s' "$RESPONSE" | grep -q '"app_id"'; then
              echo "Site OK on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed (status: ${CODE:-no response})"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error::launchoptions.dev did not serve game data after 3 attempts"
          exit 1
