name: Supabase keepalive (backup)

# PRIMARY keepalive: cron-job.org pings Supabase REST API directly once a week.
# This workflow is a secondary backup only — GHA scheduled jobs can be delayed
# by hours and are disabled after 60 days of repo inactivity, making them
# unsuitable as the primary keepalive mechanism.
#
# Use this workflow for manual health checks only (Actions tab → Run workflow).
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/games?select=count&limit=1")
          echo "Supabase response: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
